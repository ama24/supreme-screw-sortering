# Stage 2 method A: keypoints (head_top, bearing, tip) on the 384 px full-resolution crops.
# Needs a dataset exported with the crops format (tool 07 --formats ...,crops).
stage: pose
model: yolo26n-pose.pt
imgsz: 384
epochs: 150
batch: -1
patience: 40
cache: ram
workers: 4
augment:
  degrees: 180
  scale: 0.05                # crops are full resolution: the scale is exact
  mosaic: 0.0                # one screw per crop matters, not context
  close_mosaic: 0
