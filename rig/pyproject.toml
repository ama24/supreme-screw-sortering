[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "screwrig"
version = "0.1.0"
description = "Raspberry Pi side of the screw sorter: locked Pi Camera 3, printer bed, capture sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "see LICENSE in the repository root" }
# screwsynth comes from this repository: pip install -e . -e rig/  (from the repository root)
dependencies = [
    "screwsynth",
    "numpy>=1.24",
    "pyserial>=3.5",
]
# OpenCV is not listed: the PC already has opencv-contrib-python (screwsynth[calib]) and two
# OpenCV packages in one environment overwrite each other. The Pi gets the headless build from
# rig/requirements-pi.txt.

[project.scripts]
screwrig = "screwrig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screwrig"]
